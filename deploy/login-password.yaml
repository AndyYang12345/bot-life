# Optional overlay, selected by scripts/napcat only when a local secret exists.
# Digest values stay out of Compose interpolation and Docker Config.Env.
services:
  napcat:
    entrypoint:
      - /bin/bash
      - /usr/local/bin/napcat-login-entrypoint
      - /bin/bash
      - /app/entrypoint.sh
    environment:
      NAPCAT_QQ_PASSWORD_FILE: /run/secrets/napcat-qq-password-md5
    volumes:
      - type: bind
        source: ./login-entrypoint.sh
        target: /usr/local/bin/napcat-login-entrypoint
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../data/config/qq-login.md5
        target: /run/secrets/napcat-qq-password-md5
        read_only: true
        bind:
          create_host_path: false
